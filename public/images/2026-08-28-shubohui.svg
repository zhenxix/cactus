<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0d1a16"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#57ab5a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="120" r="200" fill="#2ea043" opacity="0.07"/>

  <text x="60" y="72" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#ffffff">2026 中国国际大数据产业博览会</text>
  <text x="60" y="108" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#9aa7b8">数博会在贵阳开幕 · 8月28日</text>

  <rect x="60" y="150" width="1160" height="110" rx="16" fill="#1c2333" stroke="#2d3648"/>
  <text x="84" y="192" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#7ee2a0">87 项重要成果将发布</text>
  <text x="84" y="226" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#c9d7e8">覆盖政策、技术、产品与产业报告，国家级数据与智能产业平台</text>
  <text x="84" y="252" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#9aa7b8">主题：数智共生 —— 数据要素 × 人工智能双向赋能</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="60" y="300" width="270" height="130" rx="14" fill="#171f30" stroke="#2d3648"/>
    <text x="84" y="338" font-size="19" font-weight="700" fill="#7ee2a0">数据要素</text>
    <text x="84" y="368" font-size="15" fill="#c9d7e8">数据基础制度</text>
    <text x="84" y="392" font-size="15" fill="#9aa7b8">流通交易与开发利用</text>

    <rect x="350" y="300" width="270" height="130" rx="14" fill="#171f30" stroke="#2d3648"/>
    <text x="374" y="338" font-size="19" font-weight="700" fill="#4f8cff">算力</text>
    <text x="374" y="368" font-size="15" fill="#c9d7e8">绿色算力 · 智算集群</text>
    <text x="374" y="392" font-size="15" fill="#9aa7b8">超算互联网</text>

    <rect x="640" y="300" width="270" height="130" rx="14" fill="#171f30" stroke="#2d3648"/>
    <text x="664" y="338" font-size="19" font-weight="700" fill="#c4b0ff">大模型</text>
    <text x="664" y="368" font-size="15" fill="#c9d7e8">开源生态 · 行业模型</text>
    <text x="664" y="392" font-size="15" fill="#9aa7b8">智能体应用</text>

    <rect x="930" y="300" width="290" height="130" rx="14" fill="#171f30" stroke="#2d3648"/>
    <text x="954" y="338" font-size="19" font-weight="700" fill="#ffd166">产业化</text>
    <text x="954" y="368" font-size="15" fill="#c9d7e8">国内外头部企业参展</text>
    <text x="954" y="392" font-size="15" fill="#9aa7b8">产业合作与成果转化</text>
  </g>

  <text x="60" y="478" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#9aa7b8">意义：国家级平台，观察中国 AI 产业化的窗口；与 8 月绿色算力大会、世界机器人大会形成产业共振。</text>
  <text x="60" y="548" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5b6b80">示意图 · 数据据公开报道整理</text>
</svg>