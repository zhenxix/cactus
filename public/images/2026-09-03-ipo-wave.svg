  <rect x="60" y="420" width="1160" height="100" rx="16" fill="#1c2333" stroke="#2d3648"/>
  <text x="84" y="456" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#c9d7e8">对比:开源模型商业化路径 —— 智谱"牛来"开源带动订阅放量,MaaS ARR 16 亿美元;</text>
  <text x="84" y="488" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#c9d7e8">月之暗面 Kimi 依靠产品体验与 To C/To B 双轮,估值 500 亿美元冲击港股。</text>

  <text x="60" y="548" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5b6b80">示意图 · 数据据公开报道整理</text>
